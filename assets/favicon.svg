<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#08101e" stroke="#00f0ff" stroke-width="2"/>
  
  <!-- Pipe Network Cross -->
  <path d="M12 28 H26 V12 H38 V28 H52 V36 H38 V52 H26 V36 H12 Z" fill="#0f223d" stroke="#00b4d8" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Flow Lines inside pipe -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="6,4"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="6,4"/>
  
  <!-- Center Valve / Gauge Hub -->
  <circle cx="32" cy="32" r="9" fill="#0077b6" stroke="#00f5d4" stroke-width="2"/>
  <circle cx="32" cy="32" r="4" fill="#ffffff" filter="url(#glow)"/>
</svg>
